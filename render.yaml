services:
  - type: web
    name: avom-resume-checker
    runtime: docker
    repo: https://github.com/Tejk20/AI-Resume-Checker
    branch: main
    plan: free
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: '[]'
      - key: AUTH_REQUIRED
        value: 'true'
      - key: SECURE_COOKIES
        value: 'true'
      - key: PUBLIC_ORIGIN
        value: https://avom-resume-checker.onrender.com
      - key: SEED_DEMO_DATA
        value: 'true'
