name: Hosted container checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - compose.hosted.yml
      - backend/**
      - frontend/**
      - sample_data/**
      - scripts/**
      - .github/workflows/container.yml
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build and start PostgreSQL and the full application
        run: docker compose -f compose.hosted.yml up -d --build --wait --wait-timeout 180
      - name: Check same-origin frontend and API
        run: docker compose -f compose.hosted.yml exec -T app python scripts/check_hosted_http.py
      - name: Verify real synthetic upload and MPNet ranking workflow
        run: docker compose -f compose.hosted.yml exec -T app python scripts/verify_workflow.py
      - name: Show service logs on failure
        if: failure()
        run: docker compose -f compose.hosted.yml logs --tail=100
      - name: Stop isolated CI services
        if: always()
        run: docker compose -f compose.hosted.yml down
