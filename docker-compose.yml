services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: resume
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resume_local}
      POSTGRES_DB: resume_matcher
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - resume_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume -d resume_matcher"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  resume_pgdata:
